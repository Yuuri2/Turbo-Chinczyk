#Konfiguracja produkcyjna (VM): obrazy backend/frontend są pobierane z GHCR, nic nie jest budowane.
#Lokalnie docker compose dokleja automatycznie docker-compose.override.yml (build + port bazy).
#Na VM zawsze: docker compose -f docker-compose.yml ...  (patrz scripts/deploy.sh)

#Rotacja logów
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: chinczyk-db
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-chinczyk}
      POSTGRES_USER:     ${POSTGRES_USER:-chinczyk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./baza/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chinczyk_user} -d ${POSTGRES_DB:-chinczyk}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/yuuri2/turbo-chinczyk-backend:${IMAGE_TAG:-latest}
    container_name: chinczyk-backend
    restart: unless-stopped
    mem_limit: 1g                               #heap = 75% limitu (MaxRAMPercentage w Dockerfile)
    logging: *logging

    environment:
      PGHOST: db                                #nazwa serwisu w sieci Dockera
      PGPORT: 5432
      POSTGRES_DB:       ${POSTGRES_DB:-chinczyk}
      POSTGRES_USER:     ${POSTGRES_USER:-chinczyk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s          # Spring wstaje wolniej niż reszta

  frontend:
    image: ghcr.io/yuuri2/turbo-chinczyk-frontend:${IMAGE_TAG:-latest}
    container_name: chinczyk-frontend
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging

    environment:
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost}       #wymagane przez CSRF SvelteKita
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-chinczyk}
      PGUSER:     ${POSTGRES_USER:-chinczyk_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.28-alpine
    container_name: chinczyk-nginx
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
